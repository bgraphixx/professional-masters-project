# Production-ready base — this is what Dokploy deploys.
# All config comes from ${VAR} substitution below, sourced from Dokploy's
# Environment Variables panel (which writes a .env at the compose project
# root, not backend/.env — a physical backend/.env file is NOT read here).
# See backend/.env.example for the full list of variables to set in Dokploy.
#
# For local development with hot-reload, layer on docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  db:
    image: postgres:16-alpine
    container_name: finance_tracker_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finance_tracker}
    # Not published — only reachable from other services on the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-finance_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_tracker_backend
    restart: always
    # entrypoint.sh runs `alembic upgrade head` before this
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    # Reached via dokploy-network + Traefik, not a published host port
    # (a host port here would conflict with Dokploy's own proxy on 80/443).
    expose:
      - "8000"
    environment:
      # Built from the same POSTGRES_* vars as the db service so the two can
      # never drift out of sync.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finance_tracker}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-True}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    networks:
      - default
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No target set — builds the final (nginx) stage.
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.yourdomain.com}
    container_name: finance_tracker_frontend
    restart: always
    # Reached via dokploy-network + Traefik, not a published host port.
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    depends_on:
      - backend

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
