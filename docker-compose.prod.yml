# docker-compose.prod.yml — Production overrides for NairaAI
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides the base docker-compose.yml for production deployments:
#   - No hot-reload (--reload removed)
#   - 4 uvicorn workers
#   - No source-code volume mounts (code is baked into the image)
#   - COOKIE_SECURE=True (requires HTTPS)
#   - ENVIRONMENT=production
#   - Secrets loaded from .env file (not hard-coded)

version: '3.8'

services:
  db:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finance_tracker}
    # Remove port mapping in production — DB should not be publicly accessible
    ports: []

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    # 4 workers for production throughput; remove --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    # No source-code volume mount — code is baked into the image
    volumes: []
    env_file:
      - ./backend/.env
    environment:
      - COOKIE_SECURE=True
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    # No source volume mount in production
    volumes: []
    environment:
      - VITE_API_URL=${VITE_API_URL:-https://api.yourdomain.com}
    depends_on:
      - backend
